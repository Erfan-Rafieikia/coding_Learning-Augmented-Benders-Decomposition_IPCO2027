name: bd_ml
channels:
  - conda-forge
channel_priority: strict
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - openpyxl
  - joblib
  - gensim
